<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: topo-map paper. A hero with contour lines, then trail-sign plaques leading to each gear page. */
:root {
  --paper: #eef2ef;        /* map paper, cool green-grey */
  --surface: #f9fbf9;
  --ink: #16201c;
  --ink-2: #4a5852;
  --ink-3: #7b8882;
  --rule: #d3dcd6;
  --contour: #c3cfc7;
  --sign: #f2c230;         /* trail-sign yellow */
  --sign-ink: #1b1a14;
  --forest: #2f6b4f;       /* links, positive margin */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;   /* validated chart palette, slots 1-3 */
  --font-display: "Archivo", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1513; --surface: #161e1b; --ink: #e8eee9; --ink-2: #aab7b0; --ink-3: #7d8a84;
    --rule: #26312c; --contour: #22302a; --sign: #f2c230; --sign-ink: #1b1a14; --forest: #6fc39a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1513; --surface: #161e1b; --ink: #e8eee9; --ink-2: #aab7b0; --ink-3: #7d8a84;
  --rule: #26312c; --contour: #22302a; --sign: #f2c230; --sign-ink: #1b1a14; --forest: #6fc39a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-body); }
a { color: var(--forest); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }
.gutter {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* ── Top bar ── */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.topbar .gutter { display: flex; align-items: center; gap: 6px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font: 800 1.15rem/1 var(--font-display); font-stretch: 112%; letter-spacing: -.01em; margin-right: auto; }
.brand:hover { text-decoration: none; }
.brand svg { flex: none; }
.menu { display: flex; gap: 4px; flex-wrap: wrap; }
.menu button, .menu a {
  font: 600 .92rem var(--font-body); color: var(--ink-2); background: none; border: 0; cursor: pointer;
  padding: 7px 12px; border-radius: 4px;
}
.menu a:hover, .menu button:hover { color: var(--ink); background: var(--surface); text-decoration: none; }
.menu [aria-current="page"], .menu button[aria-expanded="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 -2px 0 var(--sign); }
.stamp { font: 400 .75rem var(--font-data); color: var(--ink-3); }

/* ── Gear menu panel ── */
.gear-panel { border-top: 1px solid var(--rule); background: var(--surface); }
.gear-panel .gutter { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 18px 28px; padding-block: 18px 22px; }
.gear-panel h3 { font: 700 .78rem var(--font-display); font-stretch: 115%; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 0 0 6px; }
.gear-panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.gear-panel a { display: flex; justify-content: space-between; gap: 10px; color: var(--ink); padding: 3px 0; }
.gear-panel a span { color: var(--ink-3); font: 400 .8rem var(--font-data); }

/* ── Hero ── */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--rule); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .gutter { position: relative; padding-block: 56px 48px; display: grid; gap: 18px; }
.eyebrow { font: 600 .78rem var(--font-body); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); }
.hero h1 { margin: 0; font: 800 clamp(2.2rem, 6vw, 4.2rem)/1 var(--font-display); font-stretch: 118%; letter-spacing: -.02em; max-width: 16ch; text-wrap: balance; }
.hero h1 .big { background: var(--sign); color: var(--sign-ink); padding: 0 .14em; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.hero p { margin: 0; max-width: 58ch; color: var(--ink-2); font-size: 1.05rem; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.btn { font: 600 .95rem var(--font-body); border-radius: 4px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:hover { opacity: .88; }
.alt-strip { display: flex; flex-wrap: wrap; gap: 6px 26px; margin-top: 10px; font-size: .88rem; color: var(--ink-2); }
.alt-strip b { font: 500 1rem var(--font-data); color: var(--ink); margin-right: 4px; }

/* ── Sections ── */
main section { padding-block: 40px 8px; }
h2 { font: 800 1.55rem/1.15 var(--font-display); font-stretch: 112%; letter-spacing: -.01em; margin: 0 0 6px; text-wrap: balance; }
.lede { margin: 0 0 18px; color: var(--ink-2); max-width: 68ch; }

/* resale cards */
.flips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.flip { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; color: var(--ink); }
.flip:hover { border-color: var(--ink-3); text-decoration: none; }
.flip .t { font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.flip .meta { font-size: .8rem; color: var(--ink-3); }
.flip .money { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed var(--rule); padding-top: 10px; }
.flip .buy { font: 500 .95rem var(--font-data); color: var(--ink-2); }
.flip .gain { font: 600 1.35rem var(--font-data); color: var(--forest); }
.empty-card { background: var(--surface); border: 1px dashed var(--rule); border-radius: 6px; padding: 18px; color: var(--ink-2); display: grid; gap: 10px; }
.progress { height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--forest); }

/* trail-sign plaques */
.families { display: grid; gap: 26px; }
.family h3 { font: 700 .8rem var(--font-display); font-stretch: 115%; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); margin: 0 0 8px; }
.signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.sign {
  position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
  padding: 10px 30px 10px 14px; clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%);
}
.sign:hover { text-decoration: none; border-color: var(--ink-3); }
.sign.hot { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.sign .n { font: 700 1rem var(--font-display); font-stretch: 108%; }
.sign .d { font: 500 .8rem var(--font-data); text-align: right; }
.sign .s { grid-column: 1 / -1; font-size: .78rem; opacity: .75; }

/* charts */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; min-width: 0; }
.chart { position: relative; height: 280px; }
.empty { display: grid; place-items: center; height: 100%; color: var(--ink-3); font-size: .9rem; text-align: center; padding: 0 20px; }

/* category page */
.crumbs { font-size: .85rem; color: var(--ink-3); padding-top: 28px; }
.cat-head { display: grid; gap: 10px; padding-block: 8px 6px; }
.cat-head h1, .page-title { margin: 0; font: 800 clamp(2rem, 5vw, 3.2rem)/1 var(--font-display); font-stretch: 118%; letter-spacing: -.02em; }
.page-title { margin-bottom: 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); overflow: hidden; }
.fact { flex: 1 1 150px; padding: 10px 14px; border-right: 1px solid var(--rule); display: grid; gap: 2px; }
.fact:last-child { border-right: 0; }
.fact .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.fact .v { font: 500 1.05rem var(--font-data); }
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 12px; }
.filters input[type="search"], .filters select {
  font: 400 .95rem var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px;
}
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; }
.filters label { font-size: .88rem; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.ads { display: grid; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.ad { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 16px; border-bottom: 1px solid var(--rule); color: var(--ink); }
.ad:last-child { border-bottom: 0; }
a.ad:hover { background: var(--paper); text-decoration: none; }
.ad .t { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.ad .meta { font-size: .8rem; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ad .price { font: 600 1.05rem var(--font-data); text-align: right; }
.ad .profit { font: 500 .85rem var(--font-data); text-align: right; color: var(--ink-3); }
.ad .profit.pos { color: var(--forest); }
.tag { font: 600 .7rem var(--font-body); text-transform: uppercase; letter-spacing: .06em; padding: 1px 7px; border-radius: 3px; background: var(--paper); color: var(--ink-2); border: 1px solid var(--rule); }
.tag.flip { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.site { font-weight: 600; color: var(--ink-2); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
td.r, th.r { text-align: right; }
.state { font-size: .8rem; font-weight: 600; }
.state.ok { color: var(--forest); }
.state.learn { color: var(--ink-3); }
footer { padding-block: 40px 56px; color: var(--ink-3); font-size: .82rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<header class="topbar">
  <div class="gutter">
    <a class="brand" href="#accueil" aria-label="Scrapbot, accueil">
      <svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><path d="M1 21 L11 5 L15 11 L19 4 L29 21 Z" fill="var(--ink)"/><path d="M8.6 9 L11 5 L13.3 8.7 L11.6 8 L10.2 9.3 Z M17.1 7.2 L19 4 L21 7.3 L19.6 6.7 L18.4 7.8 Z" fill="var(--paper)"/></svg>
      Scrapbot

    <nav class="menu" aria-label="Navigation">
      <a href="#accueil" id="nav-accueil">Accueil</a>
      <button type="button" id="gearBtn" aria-expanded="false" aria-controls="gearPanel">Matériel ▾</button>
      <a href="#marche" id="nav-marche">Marché</a>
    </nav>
    <span class="stamp" id="stamp"></span>
  </div>
  <div class="gear-panel" id="gearPanel" hidden><div class="gutter" id="gearMenu"></div></div>
</header>

<main>
  <!-- ───────── Accueil ───────── -->
  <div id="view-accueil">
    <section class="hero" style="padding:0">
      <canvas id="topo" aria-hidden="true"></canvas>
      <div class="gutter">
        <span class="eyebrow" id="heroDate"></span>
        <h1 id="heroTitle"></h1>
        <p id="heroText"></p>
        <div class="cta">
          <button class="btn" type="button" id="ctaFlips">Voir les reventes</button>
          <button class="btn ghost" type="button" id="ctaGear">Parcourir le matériel</button>
        </div>
        <div class="alt-strip" id="heroStrip"></div>
      </div>
    </section>

    <section class="gutter" id="flipsSection">
      <h2>À revendre en ce moment</h2>
      <p class="lede" id="flipsLede"></p>
      <div class="flips" id="flips"></div>
    </section>

    <section class="gutter" id="gearSection">
      <h2>Le matériel</h2>
      <p class="lede">En jaune : les catégories avec des bonnes affaires cette semaine.</p>
      <div class="families" id="families"></div>
    </section>

    <section class="gutter">
      <h2>Cette semaine</h2>
      <div class="grid2">
        <div class="panel"><div class="chart"><canvas id="dealsChart" aria-label="Bonnes affaires par jour"></canvas></div></div>
        <div class="panel"><div class="chart"><canvas id="profitChart" aria-label="Marge estimée par jour"></canvas></div></div>
      </div>
    </section>
  </div>

  <!-- ───────── Catégorie ───────── -->
  <div id="view-cat" hidden>
    <div class="gutter">
      <div class="crumbs" id="crumbs"></div>
      <div class="cat-head">
        <h1 id="catTitle"></h1>
        <div class="facts" id="facts"></div>
      </div>
    </div>
    <section class="gutter">
      <h2>Annonces en ligne</h2>
      <div class="filters">
        <input type="search" id="q" placeholder="Filtrer : petzl, nomic, taille M…" aria-label="Filtrer les annonces">
        <label><input type="checkbox" id="onlyDeals"> Bonnes affaires seulement</label>
        <label for="sort">Trier</label>
        <select id="sort"><option value="seen">Plus récentes</option><option value="profit">Marge estimée</option><option value="price">Prix croissant</option></select>
      </div>
      <div class="ads" id="ads"></div>
    </section>
    <section class="gutter">
      <h2>À quel prix ça part vite ?</h2>
      <p class="lede" id="fastLede"></p>
      <div class="grid2">
        <div class="panel"><div class="chart"><canvas id="scatterChart" aria-label="Prix et jours avant la vente"></canvas></div></div>
        <div class="panel"><div class="chart"><canvas id="bandChart" aria-label="Part vendue vite par tranche de prix"></canvas></div></div>
      </div>
    </section>
  </div>

  <!-- ───────── Marché ───────── -->
  <div id="view-marche" hidden>
    <section class="gutter">
      <h1 class="page-title">Le marché</h1>
      <p class="lede" id="marketLede"></p>
      <div class="panel"><div class="chart"><canvas id="adsChart" aria-label="Annonces collectées par jour et par site"></canvas></div></div>
    </section>
    <section class="gutter">
      <h2>Toutes les catégories</h2>
      <div class="panel table-wrap" style="padding:0"><table id="catTable"></table></div>
    </section>
    <section class="gutter">
      <h2>Comment la marge est calculée</h2>
      <p class="lede" id="profitNote"></p>
    </section>
  </div>
</main>
<footer class="gutter" id="footer"></footer>

  helmets: "Casques", quickdraws_carabiners: "Dégaines & mousquetons", belay_devices: "Systèmes d'assurage", protection_cams: "Friends & coinceurs",
  packs: "Sacs à dos", sleeping_bags: "Sacs de couchage", tents: "Tentes", poles_headlamps: "Bâtons & frontales",
};
const FAMILIES = [
  ["Alpinisme & escalade", ["ice_axes", "crampons", "ice_screws", "ropes", "harnesses", "helmets", "quickdraws_carabiners", "belay_devices", "protection_cams"]],
  ["Vêtements", ["hardshell_jacket", "hardshell_pants", "down_jackets", "softshell_fleece", "base_layers", "gloves"]],
  ["Ski de randonnée", ["touring_skis", "touring_boots", "touring_bindings", "skins"]],
  ["Sécurité avalanche", ["avalanche_transceivers", "shovel_probe"]],
  ["Chaussures", ["mountaineering_boots", "climbing_shoes"]],
  ["Bivouac & divers", ["packs", "sleeping_bags", "tents", "poles_headlamps"]],
];
const SITES = { vinted: "Vinted", leboncoin: "Leboncoin", ebay: "eBay" };

const label = k => LABELS[k] || k.replace(/_/g, " ");
const site = s => SITES[s] || s;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = v => v == null ? "–" : Math.round(v * 100) + " %";
const eur = v => v == null ? "–" : `${v} €`;
const frDay = d => { const p = d.split("-"); return `${p[2]}/${p[1]}`; };
const frSeen = s => `${s.slice(8, 10)}/${s.slice(5, 7)}`;
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const $ = id => document.getElementById(id);

// Every category gets a family; ones added to config.yaml later land in "Autres".
const KNOWN = FAMILIES.flatMap(([, ks]) => ks);
const EXTRA = Object.keys(DATA.categories).filter(k => !KNOWN.includes(k));
if (EXTRA.length) FAMILIES.push(["Autres", EXTRA]);
const CATS = FAMILIES.flatMap(([, ks]) => ks).filter(k => DATA.categories[k]);
const family = k => (FAMILIES.find(([, ks]) => ks.includes(k)) || ["Autres"])[0];

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function theme() {
  return { ink: css("--ink"), ink2: css("--ink-2"), ink3: css("--ink-3"), grid: css("--rule"), surface: css("--surface"),
           series: [css("--s1"), css("--s2"), css("--s3")], data: css("--font-data"), body: css("--font-body") };
}

// ───────── Contour lines behind the hero ─────────
function drawTopo() {
  const canvas = $("topo");
  if (!canvas || !canvas.getContext) return;
  const box = canvas.getBoundingClientRect();
  if (!box.width) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = box.width * dpr; canvas.height = box.height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = css("--contour");
  // Two summits; each ring is a closed curve whose radius wobbles with a few sines.
  const peaks = [{ x: box.width * .82, y: box.height * .38, s: 1 }, { x: box.width * 1.02, y: box.height * .95, s: .7 }];
  for (const p of peaks) {
    for (let i = 1; i <= 16; i++) {
      const r = i * 26 * p.s;
      ctx.beginPath();
      for (let a = 0; a <= Math.PI * 2 + .01; a += Math.PI / 90) {
        const wobble = 1 + .16 * Math.sin(3 * a + i * .35) + .08 * Math.sin(5 * a - i * .6) + .05 * Math.sin(9 * a);
        const x = p.x + Math.cos(a) * r * wobble * 1.25, y = p.y + Math.sin(a) * r * wobble * .8;
        if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.lineWidth = i % 5 === 0 ? 1.6 : .9;   // every fifth line is an index contour, as on a real topo map
      ctx.stroke();
    }
  }
}

// ───────── Charts ─────────
const charts = {};
function draw(id, config, emptyText) {
  const canvas = $(id), box = canvas.parentElement;
  if (charts[id]) charts[id].destroy();
  const old = box.querySelector(".empty");
  if (old) old.remove();
  if (config && !window.Chart) { config = null; emptyText = "Les graphiques ont besoin d'une connexion internet."; }
  canvas.hidden = !config;
  if (!config) { const m = document.createElement("div"); m.className = "empty"; m.textContent = emptyText; box.appendChild(m); return; }
  charts[id] = new Chart(canvas, config);
}
function opts(t, { title, xTitle, yTitle, stacked = false, legend = true } = {}) {
  const axis = text => ({
    stacked, grid: { color: t.grid, drawTicks: false }, border: { color: t.grid },
    ticks: { color: t.ink3, font: { family: t.data, size: 11 }, padding: 6 },
    title: text ? { display: true, text, color: t.ink2, font: { family: t.body, size: 12 } } : undefined,
  });
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      title: title ? { display: true, text: title, align: "start", color: t.ink, font: { family: t.body, size: 14, weight: "600" }, padding: { bottom: 12 } } : undefined,
      legend: { display: legend, align: "start", labels: { color: t.ink2, boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 2, font: { family: t.body, size: 12 } } },
      tooltip: { backgroundColor: t.surface, titleColor: t.ink, bodyColor: t.ink2, borderColor: t.grid, borderWidth: 1,
                 padding: 10, titleFont: { family: t.body, weight: "600" }, bodyFont: { family: t.data, size: 12 } },
    },
    scales: { x: axis(xTitle), y: { ...axis(yTitle), beginAtZero: true } },
  };
}
const bars = t => ({ borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: "bottom", borderColor: t.surface, borderWidth: { top: 2 }, maxBarThickness: 28 });

// ───────── Accueil ─────────
function renderHome() {
  const tt = DATA.totals;
  const when = new Date(DATA.generated.replace(" ", "T"));
  $("heroDate").textContent = when.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  if (tt.offers_today > 0) {
    const s = tt.offers_today > 1 ? "s" : "";
    $("heroTitle").innerHTML = `<span class="big">${tt.offers_today}</span> bonne${s} affaire${s} aujourd'hui`;
    $("heroText").textContent = tt.open_flips
      ? `Dont ${plural(tt.open_flips, "annonce encore en ligne qui se revend", "annonces encore en ligne qui se revendent")} avec ${tt.open_profit} € de marge estimée au total.`
      : `Des prix sous ton budget sur Vinted, Leboncoin et eBay. Pas encore assez de ventes observées pour estimer les reventes.`;
  } else if (tt.ready) {
    $("heroTitle").textContent = "Rien de bon aujourd'hui, pour l'instant";
    $("heroText").textContent = `${tt.offers_7d} bonnes affaires sur les 7 derniers jours. Le bot repasse toutes les heures.`;
  } else {
    $("heroTitle").innerHTML = `Le bot <span class="big">apprend</span> le marché`;
    $("heroText").textContent = `Il collecte les annonces et note celles qui partent vite, pour savoir à quel prix chaque matériel se revend vraiment. Comptez une semaine avant les premières estimations de revente.`;
  }
  $("heroStrip").innerHTML = [
    [tt.offers_7d, "affaires sur 7 jours"],
    [`${tt.profit_7d} €`, "de marge estimée sur 7 jours"],
    [tt.ads, "annonces analysées"],
    [`${tt.ready}/${tt.categories}`, "catégories prêtes"],
  ].map(([v, k]) => `<span><b>${v}</b>${k}</span>`).join("");

  const flips = DATA.top_flips;
  $("flipsLede").textContent = flips.length
    ? `Achetées à ce prix, revendues au prix qui part en moins de ${DATA.fast_days} jours, négociation et frais déduits.` : "";
  $("flips").innerHTML = flips.length
    ? flips.slice(0, 9).map(f => `
      <a class="flip" href="${esc(f.url)}" target="_blank" rel="noopener">
        <span class="t">${esc(f.title)}</span>
        <span class="meta">${esc(label(f.search))} · ${esc(site(f.source))} · vu le ${esc(frSeen(f.seen))}</span>
        <span class="money"><span class="buy">Achat ${f.price} €</span><span class="gain">+${f.profit} €</span></span>
      </a>`).join("")
    : `<div class="empty-card">
        <strong>Pas encore de revente à proposer.</strong>
        <span>Une catégorie est prête quand le bot a vu au moins ${DATA.min_samples} ventes rapides. ${tt.ready} catégorie${tt.ready > 1 ? "s" : ""} sur ${tt.categories} le ${tt.ready > 1 ? "sont" : "est"}.</span>
        <div class="progress" role="img" aria-label="${tt.ready} catégories prêtes sur ${tt.categories}"><i style="width:${Math.round(100 * tt.ready / Math.max(1, tt.categories))}%"></i></div>
      </div>`;

  $("families").innerHTML = FAMILIES.map(([name, keys]) => {
    const ks = keys.filter(k => DATA.categories[k]);
    if (!ks.length) return "";
    return `<div class="family"><h3>${esc(name)}</h3><div class="signs">${ks.map(k => {
      const c = DATA.categories[k];
      const sub = c.ready ? `revente ≈ ${eur(c.quick_median)} · ${pct(c.sell_through)} part en ${DATA.fast_days} j` : `apprentissage ${c.quick_n}/${DATA.min_samples}`;
      return `<a class="sign${c.deals_7d ? " hot" : ""}" href="#cat-${esc(k)}">
        <span class="n">${esc(label(k))}</span><span class="d">${c.deals_7d ? plural(c.deals_7d, "affaire", "affaires") : `${c.online} en ligne`}</span>
        <span class="s">${sub}</span></a>`;
    }).join("")}</div></div>`;
  }).join("");
}

function renderHomeCharts(t) {
  const days = DATA.days.slice(-14), cut = DATA.days.length - days.length;
  const lab = days.map(frDay);
  const personal = DATA.deals_per_day.personal.slice(cut), flip = DATA.deals_per_day.flip.slice(cut);
  draw("dealsChart", personal.some(Boolean) || flip.some(Boolean) ? {
    type: "bar",
    data: { labels: lab, datasets: [
      { label: "Pour toi (sous ton budget)", data: personal, backgroundColor: t.series[0], ...bars(t) },
      { label: "À revendre", data: flip, backgroundColor: t.series[1], ...bars(t) },
    ] },
    options: opts(t, { title: "Bonnes affaires par jour", stacked: true }),
  } : null, "Aucune bonne affaire pour l'instant. En mode apprentissage, le bot collecte sans alerter.");
  const profit = DATA.profit_per_day.slice(cut);
  const po = opts(t, { title: "Marge estimée par jour", yTitle: "€", legend: false });
  po.plugins.tooltip.callbacks = { label: ctx => `${ctx.raw} € de marge sur les reventes du jour` };
  draw("profitChart", profit.some(Boolean) ? {
    type: "bar",
    data: { labels: lab, datasets: [{ label: "Marge", data: profit, backgroundColor: t.series[1], ...bars(t) }] },
    options: po,
  } : null, "Les marges apparaissent quand des catégories sont prêtes.");
}

// ───────── Catégorie ─────────
let current = null;
function renderCat(t, key) {
  const c = DATA.categories[key];
  current = key;
  $("crumbs").innerHTML = `<a href="#accueil">Accueil</a> / ${esc(family(key))} / ${esc(label(key))}`;
  $("catTitle").textContent = label(key);
  $("facts").innerHTML = [
    ["En ligne", c.online],
    ["Prix demandé (médiane)", eur(c.asking_median)],
    ["Prix de revente rapide", c.ready ? eur(c.quick_median) : `apprentissage ${c.quick_n}/${DATA.min_samples}`],
    [`Part vendue en ${DATA.fast_days} j`, c.tracked ? pct(c.sell_through) : "–"],
    ["Ventes eBay", c.ebay_sold],
  ].map(([k, v]) => `<div class="fact"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join("");
  renderAds();

  const pts = c.sold_points.length + c.unsold_points.length;
  const xs = c.sold_points.concat(c.unsold_points).map(p => p[0]);
  const so = opts(t, { title: "Chaque annonce : prix et jours en ligne", xTitle: "prix (€)", yTitle: "jours en ligne" });
  so.scales.x.beginAtZero = false;
  so.interaction = { mode: "nearest", intersect: true };
  so.plugins.tooltip.callbacks = { label: ctx => ctx.dataset.type === "line" ? null :
    `${ctx.raw.x} € · ${ctx.raw.y} j ${ctx.datasetIndex === 0 ? "avant de disparaître" : "en ligne pour l'instant"}` };
  draw("scatterChart", pts ? {
    type: "scatter",
    data: { datasets: [
      { label: "Disparue (≈ vendue)", data: c.sold_points.map(([x, y]) => ({ x, y })), backgroundColor: t.series[0], borderColor: t.surface, borderWidth: 2, pointRadius: 5, pointHoverRadius: 7 },
      { label: "Encore en vente", data: c.unsold_points.map(([x, y]) => ({ x, y })), backgroundColor: "transparent", borderColor: t.ink3, borderWidth: 1.5, pointRadius: 4, pointHoverRadius: 6 },
      { type: "line", label: `${DATA.fast_days} jours`, data: [{ x: Math.min(...xs), y: DATA.fast_days }, { x: Math.max(...xs), y: DATA.fast_days }],
        borderColor: t.series[1], borderWidth: 2, borderDash: [6, 4], pointRadius: 0, pointHoverRadius: 0 },
    ] },
    options: so,
  } : null, "Aucune annonce revisitée pour l'instant. Le bot repasse sur chaque annonce environ une fois par jour.");

  const bo = opts(t, { title: `Part vendue en moins de ${DATA.fast_days} jours, par prix`, xTitle: "tranche de prix", legend: false });
  bo.scales.y.max = 100;
  bo.scales.y.ticks.callback = v => v + " %";
  bo.plugins.tooltip.callbacks = { label: ctx => { const b = c.bands[ctx.dataIndex];
    return [`${Math.round(b.sell_through * 100)} % vendues en ${DATA.fast_days} j`, plural(b.n, "annonce", "annonces"), b.median_days != null ? `en ${b.median_days} j en général` : "aucune vendue vite"]; } };
  draw("bandChart", c.bands.length ? {
    type: "bar",
    data: { labels: c.bands.map(b => b.label.replace("€", " €")), datasets: [{ label: "vendues vite", data: c.bands.map(b => Math.round(b.sell_through * 100)),
      backgroundColor: t.series[0], borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: "bottom", maxBarThickness: 56 }] },
    options: bo,
  } : null, `Il faut au moins 12 annonces au résultat connu (disparue, ou encore en ligne après ${DATA.fast_days} jours). Cette catégorie en a ${c.tracked}.`);
}

function renderAds() {
  const c = DATA.categories[current];
  const q = $("q").value.trim().toLowerCase();
  const only = $("onlyDeals").checked;
  const sort = $("sort").value;
  let ads = c.browse.filter(a => (!q || a.title.toLowerCase().includes(q)) && (!only || a.kind));
  if (sort === "price") ads = ads.slice().sort((a, b) => a.price - b.price);
  if (sort === "profit") ads = ads.slice().sort((a, b) => (b.profit ?? -1e9) - (a.profit ?? -1e9));
  $("ads").innerHTML = ads.length ? ads.map(a => `
    <a class="ad" href="${esc(a.url)}" target="_blank" rel="noopener">
      <span class="t">${esc(a.title)}</span>
      <span class="price">${a.price} €</span>
      <span class="meta"><span class="site">${esc(site(a.source))}</span><span>vu le ${esc(frSeen(a.seen))}</span>
        ${a.kind ? (a.kind.includes("flip") ? '<span class="tag flip">À revendre</span>' : '<span class="tag">Bon prix</span>') : ""}</span>
      <span class="profit${a.profit > 0 ? " pos" : ""}">${a.profit == null ? "" : `revente ${a.resale} € · ${a.profit > 0 ? "+" : ""}${a.profit} €`}</span>
    </a>`).join("")
    : `<div class="ad"><span class="t">${c.browse.length ? "Aucune annonce ne correspond au filtre." : "Aucune annonce en ligne dans cette catégorie pour l'instant."}</span></div>`;
}

// ───────── Marché ─────────
function renderMarket(t) {
  const tt = DATA.totals;
  $("marketLede").textContent =
    `${tt.ads} annonces collectées en ${plural(tt.days, "jour", "jours")}. ${tt.tracked} ont un résultat connu ` +
    `(disparues, ou encore en ligne après ${DATA.fast_days} jours) et ${tt.ebay_sold} ventes eBay réelles sont enregistrées. C'est ce qui sert à estimer les prix de revente.`;
  draw("adsChart", DATA.days.length ? {
    type: "bar",
    data: { labels: DATA.days.map(frDay), datasets: DATA.sources.map((s, i) => ({ label: site(s), data: DATA.ads_per_day[s], backgroundColor: t.series[i % 3], ...bars(t) })) },
    options: opts(t, { title: "Annonces collectées par jour", stacked: true }),
  } : null, "Aucune annonce collectée pour l'instant.");
  $("catTable").innerHTML =
    `<thead><tr><th>Catégorie</th><th>État</th><th class="r">Annonces</th><th class="r">Prix demandé</th><th class="r">Revente rapide</th><th class="r">Vendu en ${DATA.fast_days} j</th><th class="r">Ventes eBay</th></tr></thead><tbody>` +
    CATS.map(k => { const c = DATA.categories[k]; return `<tr><td><a href="#cat-${esc(k)}">${esc(label(k))}</a></td>
      <td>${c.ready ? '<span class="state ok">✓ Prête</span>' : `<span class="state learn">◔ ${c.quick_n}/${DATA.min_samples}</span>`}</td>
      <td class="r num">${c.ads}</td><td class="r num">${eur(c.asking_median)}</td><td class="r num">${eur(c.quick_median)}</td>
      <td class="r num">${c.tracked ? pct(c.sell_through) : "–"}</td><td class="r num">${c.ebay_sold}</td></tr>`; }).join("") + "</tbody>";
  $("profitNote").textContent =
    `Marge = prix de revente − ce que tu paies (prix + frais acheteur du site). Le prix de revente part des ventes rapides observées ` +
    `(annonces disparues en moins de ${DATA.fast_days} jours, et ventes eBay). Sur Vinted et Leboncoin on retire ${Math.round(DATA.negotiation * 100)} % ` +
    `parce que les acheteurs négocient (les prix eBay sont déjà des prix payés), puis on revend ${Math.round((1 - DATA.haircut) * 100)} % en dessous pour que ça parte vite.`;
}

// ───────── Navigation ─────────
function buildMenu() {
  $("gearMenu").innerHTML = FAMILIES.map(([name, keys]) => {
    const ks = keys.filter(k => DATA.categories[k]);
    return ks.length ? `<div><h3>${esc(name)}</h3><ul>${ks.map(k =>
      `<li><a href="#cat-${esc(k)}">${esc(label(k))}<span>${DATA.categories[k].online}</span></a></li>`).join("")}</ul></div>` : "";
  }).join("");
}
function setMenu(open) {
  $("gearPanel").hidden = !open;
  $("gearBtn").setAttribute("aria-expanded", String(open));
}
function currentView() {
  const hash = location.hash.slice(1);
  if (hash.startsWith("cat-") && DATA.categories[hash.slice(4)]) return ["cat", hash.slice(4)];
  return [hash === "marche" ? "marche" : "accueil", null];
}
function render() {
  const t = theme();
  const [view, cat] = currentView();
  if (view === "cat") renderCat(t, cat);
  else if (view === "marche") renderMarket(t);
  else { renderHomeCharts(t); drawTopo(); }
}
function route() {
  const [view] = currentView();
  for (const v of ["accueil", "cat", "marche"]) $("view-" + v).hidden = v !== view;
  $("nav-accueil").setAttribute("aria-current", view === "accueil" ? "page" : "false");
  $("nav-marche").setAttribute("aria-current", view === "marche" ? "page" : "false");
  setMenu(false);
  render();
}

(function init() {
  const g = DATA.generated;
  $("stamp").textContent = `mis à jour le ${frSeen(g)} à ${g.slice(11)}`;
  $("fastLede").textContent =
    `Chaque point est une annonce que le bot a revisitée. Les points pleins ont disparu (le plus souvent : vendues) après ce nombre de jours ; ` +
    `les cercles sont encore en ligne. Sous la ligne pointillée : partie en moins de ${DATA.fast_days} jours. ` +
    `À droite, la part vendue vite par tranche de prix : là où les barres chutent, c'est le prix à partir duquel ça ne part plus.`;
  $("footer").textContent = `Scrapbot collecte les annonces publiques de Vinted, Leboncoin et eBay. Les marges sont des estimations. ` +
    `Vérifie toujours l'état du matériel de sécurité d'occasion (cordes, baudriers, casques, DVA) avant de l'acheter ou de le revendre.`;
  buildMenu();
  renderHome();
  if (window.Chart) Chart.defaults.font.family = theme().body;

  $("gearBtn").addEventListener("click", () => setMenu($("gearPanel").hidden));
  $("ctaGear").addEventListener("click", () => $("gearSection").scrollIntoView({ behavior: "smooth" }));
  $("ctaFlips").addEventListener("click", () => $("flipsSection").scrollIntoView({ behavior: "smooth" }));
  ["q", "onlyDeals", "sort"].forEach(id => $(id).addEventListener("input", renderAds));
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
  window.addEventListener("resize", () => { if (!$("view-accueil").hidden) drawTopo(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  route();
})();
</script>
